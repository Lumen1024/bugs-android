<body>

<p>Жестко убивайте жуков пока есть время (промахи - фигово)</p>

<p>Виды жуков:</p>
<ul>
    <li>коричневый — 1 очко;</li>
    <li>синий      — 2 очка;</li>
    <li>фиолетовый — 3 очка.</li>
</ul>

<p>«Назад» ставит игру на паузу. </p>
<p>Скорость, число жуков и длительность раунда настраивается</p>
